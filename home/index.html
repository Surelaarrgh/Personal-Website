<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to Oluwashola Akanni</title>

  <!-- /home is kept as a friendly alias for the site root. GitHub Pages serves
       static files only, so the redirect happens client-side: the meta refresh
       covers the no-JS case, the script below makes it instant and keeps /home
       out of the back-button history. -->
  <meta http-equiv="refresh" content="0; url=/" />
  <link rel="canonical" href="https://surelaarrgh.github.io/" />
  <meta name="robots" content="noindex" />
  <script>location.replace("/");</script>

  <style>
    body {
      background: #0d1017;
      color: #e9edf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    a { color: #ff8551; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="/">surelaarrgh.github.io</a>&hellip;</p>
</body>
</html>
